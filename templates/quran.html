<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quran Reading</title>

    <!-- Arabic Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Quran CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/quran.css') }}"
    />
  </head>

  <body>
    <main class="container">
      <!-- =====================================================
           CONTROL HEADER
      ====================================================== -->

      <section class="page-control">
        <!-- Surah -->
        <div class="surah-selector">
          <label for="surahSelect">Surah</label>

          <select id="surahSelect">
            <option value="">Select Surah</option>
          </select>
        </div>

        <!-- Juz -->
        <div class="surah-selector">
          <label for="juzSelect">Para / Juz</label>

          <select id="juzSelect">
            <option value="">Select Para</option>
          </select>
        </div>

        <!-- Page -->
        <div class="page-info">
          <span class="page-label"> Quran Page </span>

          <div class="page-number-box">
            <input type="number" id="pageInput" min="1" max="604" value="1" />

            <span>/ 604</span>
          </div>
        </div>

        <!-- Reading Mode -->
        <div class="surah-selector">
          <label for="readingMode"> Reading Mode </label>

          <select id="readingMode">
            <option value="arabic">Arabic Only</option>

            <option value="translation">Arabic + Urdu Translation</option>

            <option value="tafsir">Arabic + Translation + Tafseer</option>
          </select>
        </div>

        <!-- =================================================
             QARI SELECTION
        ================================================== -->

        <div class="surah-selector">
          <label for="qariSelect"> Qari </label>

          <select id="qariSelect">
            <option value="1">Abdul Basit — Mujawwad</option>

            <option value="2">Abdul Basit — Murattal</option>

            <option value="3">Mishary Rashid Alafasy</option>

            <option value="4">Mahmoud Khalil Al-Husary</option>

            <option value="5">Saad Al-Ghamdi</option>
          </select>
        </div>
      </section>

      <!-- =====================================================
           QURAN PAGE
      ====================================================== -->

      <section class="quran-page">
        <!-- =================================================
             QURAN HEADER
        ================================================== -->

        <div class="quran-page-header">
          <!-- Quran Title -->

          <div class="quran-heading">
            <div class="quran-icon" aria-label="Quran">📖</div>

            <div class="quran-title-content">
              <span class="small-title"> THE HOLY QURAN </span>

              <h2 id="surahTitle">Loading...</h2>

              <span class="juz-title" id="juzTitle"> Para 1 </span>
            </div>
          </div>

          <!-- Page Badge -->

          <div class="page-badge">
            Page

            <strong id="currentPage"> 1 </strong>
          </div>
        </div>

        <!-- =================================================
             BISMILLAH
        ================================================== -->

        <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>

        <!-- =================================================
             LOADING
        ================================================== -->

        <div class="loading" id="loading">
          <div class="loader"></div>

          <p>Loading Quran...</p>
        </div>

        <!-- =================================================
             ERROR
        ================================================== -->

        <div class="error-message" id="errorMessage"></div>

        <!-- =================================================
             AYAH LIST
        ================================================== -->

        <div class="ayah-list" id="ayahList"></div>
      </section>

      <!-- =====================================================
           BOTTOM NAVIGATION
      ====================================================== -->

      <section class="bottom-navigation">
        <button class="nav-button" id="previousPageBottom" type="button">
          ← Previous Page
        </button>

        <div class="page-progress">
          <span id="progressText"> Page 1 of 604 </span>

          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <button class="nav-button primary" id="nextPageBottom" type="button">
          Next Page →
        </button>
      </section>
    </main>

    <!-- =====================================================
         QURAN JAVASCRIPT
    ====================================================== -->

    <script src="{{ url_for('static', filename='js/quran.js') }}"></script>
  </body>
</html>
